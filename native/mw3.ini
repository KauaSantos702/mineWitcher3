; MineWitcher3 (mw3.asi). Opcional: copie para a pasta do witcher3.exe
; (The Witcher 3\bin\x64_dx12\mw3.ini). Sem este arquivo valem os valores abaixo.

[Minecraft]
; 1 = iniciar o Minecraft (Prism, instancia MineWitcher3) junto com o jogo; 0 = nao iniciar.
bStartMinecraft=1
; Vazio = Prism portatil em %LOCALAPPDATA%\MineWitcher3\Prism\prismlauncher.exe
sLauncher=
sArguments=--launch MineWitcher3

[Input]
; 0 = nunca mandar teclado/mouse ao Minecraft (a camera ainda segue o MC se ele estiver linkado).
bForwardInput=1

[Collision]
; StaticTrace por frame que o script pode gastar mandando a colisao do W3 ao Minecraft (16..4000).
iTracesPerFrame=200
; 1 = gravar cada coluna tracada em bin\x64_dx12\mw3_colcapture.bin (ate 50 MB) para analise:
;     native\build-*\Release\mw3_coltest.exe --replay <arquivo>  (erro do topo, tetos falsos, travadas).
bCapture=0

[Overlay]
; 1 = desenhar a mao, o HUD e as telas do Minecraft por cima do jogo (hook de Present do DX12).
; 0 = sem overlay (o jogo nao instala nenhum hook de render).
; Desligado por padrao enquanto nao for validado no jogo. A versao de 2026-10-11 travava com o
; overlay da Steam (recursao infinita); a correcao engancha o proxy do Streamline, acima da Steam.
bEnable=0
; Brilho (nits) do branco do overlay quando o jogo esta em HDR (80..1000).
iHdrPaperWhiteNits=200
